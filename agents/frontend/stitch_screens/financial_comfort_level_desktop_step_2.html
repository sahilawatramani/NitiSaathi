<script>
        // Simple script to handle visual state changes for radio buttons
        // Tailwind 'peer' and 'has-[:checked]' classes handle most of this, 
        // but this ensures fallback behavior and cleans up manual classes
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all labels
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary-container', 'bg-caution-tint');
                    label.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                    
                    const texts = label.querySelectorAll('p');
                    texts[0].classList.remove('text-primary');
                    texts[0].classList.add('text-on-surface');
                    texts[1].classList.remove('text-primary/80');
                    texts[1].classList.add('text-on-surface-variant');
                    
                    const icon = label.querySelector('.material-symbols-outlined');
                    icon.classList.remove('opacity-100');
                    icon.classList.add('opacity-0');
                });

                // Apply active styles to selected label
                if (e.target.checked) {
                    const activeLabel = e.target.closest('label');
                    activeLabel.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    activeLabel.classList.add('border-primary-container', 'bg-caution-tint');
                    
                    const activeTexts = activeLabel.querySelectorAll('p');
                    activeTexts[0].classList.remove('text-on-surface');
                    activeTexts[0].classList.add('text-primary');
                    activeTexts[1].classList.remove('text-on-surface-variant');
                    activeTexts[1].classList.add('text-primary/80');
                    
                    const activeIcon = activeLabel.querySelector('.material-symbols-outlined');
                    activeIcon.classList.remove('opacity-0');
                    activeIcon.classList.add('opacity-100');
                }
            });
        });
    </script>
