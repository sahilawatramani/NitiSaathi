<!-- Onboarding Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-card-elevation p-stack-lg transition-shadow duration-300 hover:shadow-card-hover border border-transparent hover:border-primary-container/10">
<!-- Top: Back & Steps -->

</button>

<div class="h-2 w-2 rounded-full bg-surface-variant"></div>

</div>

<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">आपकी जानकारी / Your Details</h1>
<p class="font-body-md text-body-md text-text-warm-gray">यह जानकारी सही योजनाएं दिखाने में मदद करती है / This helps us show you the right schemes.</p>
</div>
<!-- Form -->
<form class="space-y-gutter">
<!-- Two Column Grid for Row 1 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Field 1: Age -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="age">उम्र / Age</label>
<div class="relative custom-ring rounded">
<input class="w-full h-12 bg-background-off-white border-0 rounded px-4 text-on-surface focus:bg-surface-container-lowest focus:ring-0 transition-colors" id="age" name="age" placeholder="e.g. 32" type="number">
</div>
<span class="font-label-sm text-label-sm text-text-warm-gray">कुछ सरकारी योजनाओं की उम्र सीमा होती है / Some schemes have age limits</span>
</div>
<!-- Field 2: Income -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="income">पिछले महीने की अनुमानित कमाई / Approximate income last month</label>
<div class="relative custom-ring rounded flex items-center bg-background-off-white focus-within:bg-surface-container-lowest transition-colors">
<span class="pl-4 text-on-surface-variant font-body-md">₹</span>
<input class="w-full h-12 bg-transparent border-0 rounded-r px-2 text-on-surface focus:ring-0" id="income" name="income" placeholder="0" type="number">
</div>
</div>
</div>
<!-- Field 3: Platforms (Full Width) -->
<div class="flex flex-col gap-3">
<label class="font-label-lg text-label-lg text-on-surface">आप किस प्लेटफॉर्म पर काम करते हैं? / Which platform(s) do you work with?</label>
<div class="flex flex-wrap gap-3">
<button class="chip-selected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-opacity-90" type="button">Swiggy</button>
<button class="chip-unselected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-caution-tint hover:border-primary-container hover:text-primary-container" type="button">Zomato</button>
<button class="chip-unselected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-caution-tint hover:border-primary-container hover:text-primary-container" type="button">Ola</button>
<button class="chip-unselected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-caution-tint hover:border-primary-container hover:text-primary-container" type="button">Uber</button>
<button class="chip-selected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-opacity-90" type="button">Rapido</button>
<button class="chip-unselected px-4 py-2 rounded-full border font-label-lg text-label-lg transition-colors cursor-pointer hover:bg-caution-tint hover:border-primary-container hover:text-primary-container" type="button">Other</button>

</div>

<button class="segmented-btn-unselected px-6 py-2 rounded-md font-label-lg text-label-lg transition-colors hover:bg-surface-variant focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-container" type="button">No</button>
</div>
</div>
<!-- Field 5: e-Shram -->
<div class="flex flex-col gap-3">
<label class="font-label-lg text-label-lg text-on-surface">क्या आप e-Shram में रजिस्टर्ड हैं? / Registered with e-Shram?</label>
<div class="flex p-1 bg-background-off-white rounded-lg border border-surface-container-high w-fit">
<button class="segmented-btn-unselected px-4 py-2 rounded-md font-label-lg text-label-lg transition-colors hover:bg-surface-variant focus:outline-none" type="button">Yes</button>
<button class="segmented-btn-unselected px-4 py-2 rounded-md font-label-lg text-label-lg transition-colors hover:bg-surface-variant focus:outline-none" type="button">No</button>
<button class="segmented-btn-selected px-4 py-2 rounded-md font-label-lg text-label-lg transition-colors focus:outline-none" type="button">Not sure</button>
</div>
</div>

<div class="flex p-1 bg-background-off-white rounded-lg border border-surface-container-high w-full md:w-fit">
<button class="flex-1 md:flex-none segmented-btn-unselected px-6 py-2 rounded-md font-label-lg text-label-lg transition-colors hover:bg-surface-variant focus:outline-none" type="button">Yes</button>
<button class="flex-1 md:flex-none segmented-btn-selected px-6 py-2 rounded-md font-label-lg text-label-lg transition-colors focus:outline-none" type="button">No</button>
<button class="flex-1 md:flex-none segmented-btn-unselected px-6 py-2 rounded-md font-label-lg text-label-lg transition-colors hover:bg-surface-variant focus:outline-none" type="button">Not sure</button>
</div>
</div>
<!-- Bottom Action -->
<div class="pt-8 flex justify-center">
<button class="w-full bg-[#E63946] hover:bg-primary-container text-on-primary py-4 rounded-xl font-headline-sm transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2" type="button">
                        आगे बढ़ें / Continue
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>

<!-- Optional Interaction Script -->
<script>
        // Simple script to toggle chip selection for demonstration purposes
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('button[class*="chip-"]');
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    if (this.classList.contains('chip-selected')) {
                        this.classList.replace('chip-selected', 'chip-unselected');
                    } else {
                        this.classList.replace('chip-unselected', 'chip-selected');
                    }
                });
            });

            // Segmented control logic
            const segmentedGroups = document.querySelectorAll('.flex.p-1.bg-background-off-white');
            segmentedGroups.forEach(group => {
                const buttons = group.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        buttons.forEach(b => {
                            b.classList.replace('segmented-btn-selected', 'segmented-btn-unselected');
                        });
                        this.classList.replace('segmented-btn-unselected', 'segmented-btn-selected');
                    });
                });
            });
        });
    </script>
